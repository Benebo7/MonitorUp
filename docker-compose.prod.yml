version: '3.8'

services:
  api:
    image: ${DOCKER_IMAGE:-ghcr.io/benebo7/monitorup-api:latest}
    container_name: monitorup-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      - redis_cache
    restart: unless-stopped

  redis_cache:
    image: redis:alpine
    container_name: monitorup-redis
    restart: unless-stopped

  worker:
    image: ${DOCKER_IMAGE:-ghcr.io/benebo7/monitorup-api:latest}
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis_cache
    restart: unless-stopped

  beat:
    image: ${DOCKER_IMAGE:-ghcr.io/benebo7/monitorup-api:latest}
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis_cache
    restart: unless-stopped
