apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: monitorup:local
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: monitorup-config
          
